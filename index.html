<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#22303F">
<title>SiWARGA</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/inti/base.css">
<link rel="stylesheet" href="/inti/components.css">
</head>
<body>

<!-- =================================================================
     GUDANG IKON — bergaya Lucide (lucide.dev, lisensi MIT)
     Grid 24x24, ketebalan garis 2, ujung membulat.

     Ikon ditempel langsung, BUKAN lewat CDN. Alasannya: aplikasi ini
     dipakai di HP dengan sinyal naik-turun, dan ikon darurat harus
     tetap muncul meski jaringan putus.

     Nama Lucide aslinya ditulis di komentar tiap baris. Kalau ada yang
     kurang pas, cari nama itu di lucide.dev, salin isi SVG-nya,
     lalu tukar isi <symbol> yang bersangkutan.

     Kalau sebuah tombol tampil tapi gambarnya kosong, berarti
     simbolnya belum terdaftar di blok ini.
     ================================================================= -->
<svg style="display:none" aria-hidden="true"><defs>

  <!-- ===== Navigasi ===== -->
  <!-- menu -->
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></symbol>
  <!-- layout-grid -->
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
  <!-- chevron-right -->
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <!-- x -->
  <symbol id="i-tutup" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>

  <!-- ===== Menu utama ===== -->
  <!-- house -->
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <!-- home -->
  <symbol id="i-house" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  <!-- contact -->
  <symbol id="i-idcard" viewBox="0 0 24 24"><rect width="18" height="14" x="3" y="5" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 17c.5-1.8 1.7-2.8 3-2.8s2.5 1 3 2.8"/><path d="M15 9h4"/><path d="M15 13h3"/></symbol>
  <!-- wallet -->
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
  <!-- shield-check -->
  <symbol id="i-shieldcheck" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
  <!-- folder-open -->
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></symbol>
  <!-- users -->
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <!-- hand-coins -->
  <symbol id="i-coin" viewBox="0 0 24 24"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></symbol>
  <!-- book-open -->
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
  <!-- clipboard-check -->
  <symbol id="i-clip" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></symbol>
  <!-- map -->
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></symbol>
  <!-- network -->
  <symbol id="i-tree" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></symbol>
  <!-- mail -->
  <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  <!-- shield -->
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
  <!-- gift -->
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></symbol>
  <!-- landmark -->
  <symbol id="i-bank" viewBox="0 0 24 24"><path d="M10 18v-7"/><path d="M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></symbol>

  <!-- sliders-horizontal — ikon pengaturan, tidak mungkin tertukar dengan matahari -->
  <symbol id="i-atur" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>

  <!-- ===== Aksi ===== -->
  <!-- pencil -->
  <symbol id="i-pensil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
  <!-- plus -->
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <!-- trash-2 -->
  <symbol id="i-hapus" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
  <!-- save -->
  <symbol id="i-simpan" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></symbol>

  <!-- ===== Beranda ===== -->
  <!-- megaphone -->
  <symbol id="i-mega" viewBox="0 0 24 24"><path d="M3 11a1 1 0 0 1 1-1h2.5a1 1 0 0 0 .71-.29l5.08-5.09A1.5 1.5 0 0 1 15 5.73v12.54a1.5 1.5 0 0 1-2.71.89l-5.08-5.09A1 1 0 0 0 6.5 14H4a1 1 0 0 1-1-1z"/><path d="M18.5 9a4 4 0 0 1 0 6"/></symbol>
  <!-- lamp -->
  <symbol id="i-lamp" viewBox="0 0 24 24"><path d="M8 2h8l4 10H4z"/><path d="M12 12v6"/><path d="M8 22v-2c0-1.1.9-2 2-2h4a2 2 0 0 1 2 2v2z"/></symbol>
  <!-- badge-check -->
  <symbol id="i-seal" viewBox="0 0 24 24"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76"/><path d="m9 12 2 2 4-4"/></symbol>
  <!-- calendar -->
  <symbol id="i-kalender" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
  <!-- clock -->
  <symbol id="i-jam" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <!-- user -->
  <symbol id="i-orang" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>

  <!-- ===== Sinyal darurat ===== -->
  <!-- siren -->
  <symbol id="i-siren" viewBox="0 0 24 24"><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/></symbol>
  <!-- flame -->
  <symbol id="i-api" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <!-- venetian-mask -->
  <symbol id="i-maling" viewBox="0 0 24 24"><path d="M2 12a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V7a3 3 0 0 0-3-3c-2 0-4 1-7 3-3-2-5-3-7-3a3 3 0 0 0-3 3z"/><path d="M6 11c1.5 0 3 .5 3 2-1.5 0-3 0-3-2"/><path d="M18 11c-1.5 0-3 .5-3 2 1.5 0 3 0 3-2"/></symbol>
  <!-- briefcase-medical -->
  <symbol id="i-medis" viewBox="0 0 24 24"><path d="M12 11v4"/><path d="M14 13h-4"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><rect width="20" height="14" x="2" y="6" rx="2"/></symbol>
  <!-- triangle-alert -->
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>

</defs></svg>


<div class="app">
  <div id="konten"><div class="memuat">Memuat…</div></div>

  <button class="sos sembunyi" id="btnSos" aria-label="Sinyal darurat">
    <svg class="ic ic-lg"><use href="#i-siren"/></svg>
  </button>

  <nav class="bnav" id="bnav"></nav>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer">
  <div class="dr-head">
    <b id="drNama">SiWARGA</b>
    <small id="drSub">Sistem Integrasi Warga</small>
    <div class="dr-akun">
      <span id="drRole">Mode Tamu</span>
      <button id="btnAkun">Login</button>
    </div>
  </div>
  <div class="dr-scroll" id="drMenu"></div>
  <div class="dr-foot">SiWARGA PWA · v2.0</div>
</aside>

<div class="sheet" id="sheetLogin">
  <div class="sheet-box">
    <h2>Login Pengurus</h2>
    <p>Pilih jabatan dan masukkan PIN.</p>
    <div class="pesan-galat" id="galatLogin"></div>
    <div class="field">
      <label for="inRole">Jabatan</label>
      <select id="inRole">
        <option value="RT">Admin RT</option>
        <option value="SEKRETARIS">Sekretaris</option>
        <option value="BENDAHARA">Bendahara RT</option>
        <option value="PKK">Admin PKK</option>
        <option value="HUMAS">Admin Humas</option>
        <option value="TELLER">Admin Bank PKK</option>
        <option value="DEVELOPER">Super Admin</option>
      </select>
    </div>
    <div class="field">
      <label for="inPin">PIN</label>
      <input id="inPin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
    </div>
    <button class="btn btn-utama" id="btnMasuk">Masuk</button>
    <button class="btn btn-halus" id="btnBatal">Batal</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/inti/api.js"></script>
<script src="/inti/app.js"></script>
</body>
</html>
