<div class="app">
  <div id="konten"><div class="memuat">Memuat…</div></div>

  <button class="sos sembunyi" id="btnSos" aria-label="Sinyal darurat">
    <svg class="ic ic-lg"><use href="#i-siren"/></svg>
  </button>

  <nav class="bnav" id="bnav"></nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head">
    <b id="drNama">SiWARGA</b>
    <small id="drSub">Sistem Integrasi Warga</small>
    <div class="dr-akun">
      <span id="drRole">Mode Tamu</span>
      <button id="btnAkun">Login</button>
    </div>
  </div>
  <div class="dr-scroll" id="drMenu"></div>
  <div class="dr-foot">SiWARGA PWA · v2.0</div>
</aside>

<div class="sheet" id="sheetLogin">
  <div class="sheet-box">
    <h2>Login Pengurus</h2>
    <p>Pilih jabatan dan masukkan PIN.</p>
    <div class="pesan-galat" id="galatLogin"></div>
    <div class="field">
      <label for="inRole">Jabatan</label>
      <select id="inRole">
        <option value="RT">Admin RT</option>
        <option value="SEKRETARIS">Sekretaris</option>
        <option value="BENDAHARA">Bendahara RT</option>
        <option value="PKK">Admin PKK</option>
        <option value="HUMAS">Admin Humas</option>
        <option value="TELLER">Admin Bank PKK</option>
        <option value="DEVELOPER">Super Admin</option>
      </select>
    </div>
    <div class="field">
      <label for="inPin">PIN</label>
      <input id="inPin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••">
    </div>
    <button class="btn btn-utama" id="btnMasuk">Masuk</button>
    <button class="btn btn-halus" id="btnBatal">Batal</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/inti/api.js"></script>
<script src="/inti/app.js"></script>
</body>
</html>
