<style>
/* ===== LAPORAN KINERJA PKK — gaya khusus modul ===== */
.lp-filter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.lp-filter select{width:100%;box-sizing:border-box;font:inherit;font-size:.84rem;padding:10px 12px;
  border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--ink);}
.lp-aksi{display:flex;gap:8px;margin-bottom:12px;}
.lp-aksi a,.lp-aksi button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  font:inherit;font-size:.8rem;font-weight:700;padding:11px;border-radius:var(--r-md);border:none;text-decoration:none;}
.lp-isi{background:var(--hero-1);color:#fff;}
.lp-cetak{background:var(--card);color:var(--hero-1);box-shadow:0 2px 12px rgba(31,41,51,.06);}
.lp-aksi .ic{width:16px;height:16px;}

.lp-ringkas{background:var(--card);border-radius:var(--r-lg);padding:13px 14px;margin-bottom:12px;
  box-shadow:0 2px 12px rgba(31,41,51,.06);}
.lp-angka{display:flex;gap:18px;margin-bottom:8px;}
.lp-angka div b{display:block;font-size:1.25rem;font-weight:700;color:var(--hero-1);}
.lp-angka div small{font-size:.66rem;color:var(--muted);font-weight:600;}
.lp-prog{display:flex;flex-wrap:wrap;gap:6px;}
.lp-prog span{font-size:.66rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink);}
.lp-prog span b{color:var(--hero-1);margin-left:3px;}

.lp-cari{width:100%;box-sizing:border-box;font:inherit;font-size:.84rem;padding:10px 13px;margin-bottom:12px;
  border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--ink);}

.lp-kartu{background:var(--card);border-radius:var(--r-lg);padding:13px 14px;margin-bottom:9px;
  box-shadow:0 2px 12px rgba(31,41,51,.06);}
.lp-atas{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
.lp-atas b{flex:1;min-width:0;font-size:.88rem;line-height:1.35;overflow-wrap:anywhere;}
.lp-tag{font-size:.58rem;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:999px;
  background:var(--gold-soft);color:var(--gold-ink);flex-shrink:0;max-width:45%;
  text-align:center;line-height:1.3;}
.lp-meta{font-size:.7rem;color:var(--muted);margin-bottom:6px;}
.lp-detail{font-size:.76rem;line-height:1.5;}
.lp-detail span{color:var(--muted);}
.lp-foto{margin-top:9px;font:inherit;font-size:.72rem;font-weight:700;padding:7px 13px;border-radius:999px;
  border:none;background:var(--bg);color:var(--hero-1);display:inline-flex;align-items:center;gap:6px;}
.lp-foto .ic{width:14px;height:14px;}

.lp-gambar{margin-bottom:12px;border-radius:var(--r-md);overflow:hidden;background:var(--bg);
  min-height:140px;display:flex;align-items:center;justify-content:center;}
.lp-gambar img{display:block;width:100%;height:auto;}
.lp-gambar .ket{font-size:.74rem;color:var(--muted);padding:20px;text-align:center;}
.lp-gambar .ket a{color:var(--hero-1);font-weight:700;}
.lp-sembunyi{display:none !important;}
</style>

<div class="plain-head">
  <button class="hero-btn" onclick="bukaDrawer()">
    <svg class="ic"><use href="#i-menu"/></svg>
  </button>
  <div>
    <h1>Laporan Kinerja PKK</h1>
    <small id="lpSub">Memuat…</small>
  </div>
  <button class="hero-btn" style="margin-left:auto;" onclick="muatLaporan()" aria-label="Segarkan">
    <svg class="ic"><use href="#i-segar"/></svg>
  </button>
</div>

<div class="wrap" style="margin-top:16px;">
  <div class="lp-filter">
    <select id="lpTahun" onchange="muatLaporan()"><option value="">Semua tahun</option></select>
    <select id="lpBulan" onchange="muatLaporan()">
      <option value="">Semua bulan</option>
      <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
      <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
      <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
      <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
    </select>
  </div>

  <div class="lp-aksi">
    <a class="lp-isi lp-sembunyi" id="lpIsi" href="#" target="_blank" rel="noopener">
      <svg class="ic"><use href="#i-plus"/></svg> Isi Laporan
    </a>
    <button class="lp-cetak" onclick="cetakLaporan()">
      <svg class="ic"><use href="#i-berkas"/></svg> Cetak
    </button>
  </div>

  <div id="lpRingkas"></div>
  <input class="lp-cari lp-sembunyi" id="lpCari" type="search" placeholder="Cari kegiatan, kader, program…"
         oninput="Lp.cari = this.value; gambarLaporan();" autocomplete="off">
  <div id="lpDaftar"><div class="memuat">Memuat…</div></div>
</div>

<div class="pad-bot"></div>


<!-- ============ LEMBAR: FOTO ============ -->
<div class="lembar" id="lembarFotoLaporan">
  <div class="lembar-isi">
    <div class="lembar-atas">
      <h2 id="lfJudul">Foto Kegiatan</h2>
      <button onclick="tutupLembar('lembarFotoLaporan')"><svg class="ic ic-sm"><use href="#i-tutup"/></svg></button>
    </div>
    <div class="lembar-badan" id="lfIsi"></div>
  </div>
</div>
